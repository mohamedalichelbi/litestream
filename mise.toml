[tools]
clang = "22.1.8"
go = "1.25.14"

[env]
CC = "clang"
CGO_ENABLED = "1"
GOCACHE = "{{ config_root }}/.cache/go-build"
GOMODCACHE = "{{ config_root }}/.cache/go-mod"

[tasks.format]
description = "Format Go source files."
run = "go fmt ./..."

[tasks.test]
description = "Run the Go test suite."
run = "go test ./..."

[tasks.test-race]
description = "Run the Go test suite with the race detector."
run = "go test -race ./..."

[tasks.vfs-test]
description = "Run the writable VFS test suite."
run = '''
go test ./...
go test -tags='vfs,SQLITE3VFS_LOADABLE_EXT' .
go test -tags=vfs ./cmd/litestream-vfs
'''

[tasks.vfs-durability-test]
description = "Check non-blocking durability status through the VFS and SQLite binding."
run = '''
go test -race -tags='vfs,SQLITE3VFS_LOADABLE_EXT' -run '^TestVFSFile_DurabilityStatus$' -count=1 -timeout=30s .
go test -race -tags=vfs -run '^TestVFS_DurabilityStatusDuringUpload$' -count=1 -timeout=30s ./cmd/litestream-vfs
'''

[tasks.vfs-close-test]
description = "Check close errors and SQLite's close-time persistence limit."
run = '''
go test -race -tags='vfs,SQLITE3VFS_LOADABLE_EXT' -run '^TestVFSFile_CloseErrors$' -count=1 -timeout=30s .
go test -race -tags=vfs -run '^TestVFS_SQLiteCloseDoesNotConfirmPersistence$' -count=1 -timeout=30s ./cmd/litestream-vfs
'''

[tasks.vfs-short-write-test]
description = "Reject sync and close after a real partial buffer write on Linux."
run = "go test -race -tags='vfs,SQLITE3VFS_LOADABLE_EXT' -run '^TestVFSFile_PartialBufferWriteFailure$' -count=5 -timeout=1m ."

[tasks.vfs-page-io-test]
description = "Check missing pages, partial writes, short reads, and buffer errors."
run = "go test -race -tags='vfs,SQLITE3VFS_LOADABLE_EXT' -run '^TestVFSFile_(PageReadFailure|ShortHeaderRead|FailedBufferWriteDoesNotGrow)$' -count=10 -timeout=30s ."

[tasks.vfs-poll-order-test]
description = "Check poll ordering against dirty writes, sync, and truncation."
run = '''
go test -race -tags='vfs,SQLITE3VFS_LOADABLE_EXT' -run '^TestVFSFile_Poll(CannotUndoLocalSync|PreservesUnsynchronizedPages)$' -count=10 -timeout=30s .
go test -race -tags=vfs -run '^TestVFS_Truncate$' -count=50 -timeout=2m ./cmd/litestream-vfs
'''

[tasks.vfs-build-linux-amd64]
description = "Build the Linux AMD64 writable VFS extension."
run = '''
mkdir -p dist
go build -tags='vfs,SQLITE3VFS_LOADABLE_EXT' -o dist/litestream-vfs-linux-amd64.a -buildmode=c-archive ./cmd/litestream-vfs
cp dist/litestream-vfs-linux-amd64.h src/litestream-vfs.h
clang -DSQLITE3VFS_LOADABLE_EXT -g -fPIC -shared -o dist/litestream-vfs-linux-amd64.so src/litestream-vfs.c dist/litestream-vfs-linux-amd64.a -lpthread -ldl -lm
'''
